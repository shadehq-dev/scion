[package]
name = "haunt"
version = "0.3.2"
description = "A live, clickable map of a TypeScript codebase"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "haunt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
gix = "=0.90.0"
notify = "=8.2.0"
# Locks that stay usable after a panic in another thread (std's are poisoned for good); in the tree already.
parking_lot = "=0.12.5"
notify-debouncer-full = "=0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-window-state = "=2.5.0"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tree-sitter = "=0.27.1"
tree-sitter-c = "=0.24.2"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-cpp = "=0.23.4"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-lua = "=0.5.0"
tree-sitter-php = "=0.25.1"
tree-sitter-python = "=0.25.0"
tree-sitter-ruby = "=0.23.1"
tree-sitter-rust = "=0.24.2"

# The desktop's look on Linux, from the settings portal over D-Bus (desktop.rs); in the tree already (the notification
# and single-instance plugins).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# gix, the diffs and the hashing are many times slower unoptimised: dependencies are optimised in development too
# (built once), Haunt's own code stays quick to rebuild.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
tempfile = "3.27.0"
